      const rect = stage.getBoundingClientRect();
      const distance = Math.hypot(points[0].x - points[1].x, points[0].y - points[1].y) || 1;
      const centerX = (points[0].x + points[1].x) / 2 - rect.left;
      const centerY = (points[0].y + points[1].y) / 2 - rect.top;
      const zoom = clamp(pinch.zoom * (distance / pinch.distance), MIN_ZOOM, MAX_ZOOM);
      const docX = (pinch.centerX - pinch.viewX) / pinch.zoom;
      const docY = (pinch.centerY - pinch.viewY) / pinch.zoom;
      view.zoom = zoom;
      view.x = centerX - docX * zoom;
      view.y = centerY - docY * zoom;
      requestRender();
    }

    function nudgeSelection(dx, dy) {
      const list = selectedShapes();
      if (!list.length) {
        return;
      }
      pushHistory();
      list.forEach((shape) => moveShape(shape, dx, dy));
      requestRender();
    }

    function duplicateSelection() {
      const list = selectedShapes();
      if (!list.length) {
        return;
      }
      pushHistory();
      const copies = list.map((shape) => {
        const copy = JSON.parse(JSON.stringify(shape));
        copy.id = idSeed++;
        shapeCounter += 1;
        copy.name = `${shape.name} のコピー`;
        shapes.push(copy);
        moveShape(copy, 12, 12);
        return copy;
      });
      selectedIds = copies.map((copy) => copy.id);
      requestRender();
      setNotice("複製しました");
    }

    function deleteSelection() {
      const list = selectedShapes();
      if (!list.length) {
        return;
      }
      pushHistory();
      shapes = shapes.filter((shape) => !selectedIds.includes(shape.id));
      selectedIds = [];
      editingNodePathId = null;
      requestRender();
      setNotice("削除しました");
    }

    function changeOrder(mode) {
      const list = selectedShapes();
      if (!list.length) {
        return;
      }
      pushHistory();
      const picked = shapes.filter((shape) => selectedIds.includes(shape.id));
      const rest = shapes.filter((shape) => !selectedIds.includes(shape.id));
      if (mode === "front") {
        shapes = rest.concat(picked);
      } else if (mode === "back") {
        shapes = picked.concat(rest);
      } else {
        const step = mode === "up" ? 1 : -1;
        const indexes = picked.map((shape) => shapes.indexOf(shape));
        const ordered = step > 0 ? indexes.slice().sort((a, b) => b - a) : indexes.slice().sort((a, b) => a - b);
        ordered.forEach((index) => {
          const next = index + step;
          if (next < 0 || next >= shapes.length || selectedIds.includes(shapes[next].id)) {
            return;
          }
          const [moved] = shapes.splice(index, 1);
          shapes.splice(next, 0, moved);
        });
      }
      requestRender();
    }

    function alignSelection(mode) {
      const list = selectedShapes();
      if (!list.length) {
        return;
      }
      const frame = alignBase === "canvas"
        ? { x: 0, y: 0, w: doc.width, h: doc.height }
        : (() => {
          const boxes = list.map(worldBBox);
          const x = Math.min(...boxes.map((box) => box.x));
          const y = Math.min(...boxes.map((box) => box.y));
          const right = Math.max(...boxes.map((box) => box.x + box.w));
          const bottom = Math.max(...boxes.map((box) => box.y + box.h));
          return { x, y, w: right - x, h: bottom - y };
        })();

      pushHistory();
      list.forEach((shape) => {
        const box = worldBBox(shape);
        let dx = 0;
        let dy = 0;
        if (mode === "left") {
          dx = frame.x - box.x;
        } else if (mode === "centerX") {
          dx = frame.x + frame.w / 2 - (box.x + box.w / 2);
        } else if (mode === "right") {
          dx = frame.x + frame.w - (box.x + box.w);
        } else if (mode === "top") {
          dy = frame.y - box.y;
        } else if (mode === "centerY") {
          dy = frame.y + frame.h / 2 - (box.y + box.h / 2);
        } else if (mode === "bottom") {
          dy = frame.y + frame.h - (box.y + box.h);
        }
        moveShape(shape, dx, dy);
      });
      requestRender();
    }

    function flipSelection(horizontal) {
      const list = selectedShapes();
      if (!list.length) {
        return;
      }
      pushHistory();
      const frame = selectionFrame();
      list.forEach((shape) => {
        if (list.length === 1) {
          const center = centerOf(shape);
          scaleShapeAbout(shape, horizontal ? -1 : 1, horizontal ? 1 : -1, center.x, center.y);
        } else {
          scaleShapeAbout(shape, horizontal ? -1 : 1, horizontal ? 1 : -1, frame.cx, frame.cy);
          shape.rot = normalizeAngle(-shape.rot);
        }
      });
      requestRender();
      setNotice(horizontal ? "左右反転しました" : "上下反転しました");
    }

    function scaleSelectionTo(nextWidth, nextHeight) {
      const frame = selectionFrame();
      if (!frame) {
        return;
      }
      const list = selectedShapes();
      const sx = Math.max(nextWidth, 1) / Math.max(frame.w, 0.001);
      const sy = Math.max(nextHeight, 1) / Math.max(frame.h, 0.001);
      pushHistory();
      const anchor = { x: frame.x, y: frame.y };
      if (list.length === 1) {
        const shape = list[0];
        const center = { x: frame.cx, y: frame.cy };
        scaleShapeAbout(shape, sx, sy, anchor.x, anchor.y);
        const nextCenter = centerOf(shape);
        const before = rotatePoint(anchor, center, frame.rot);
        const after = rotatePoint(anchor, nextCenter, frame.rot);
        moveShape(shape, before.x - after.x, before.y - after.y);
      } else {
        list.forEach((shape) => scaleShapeAbout(shape, sx, sy, anchor.x, anchor.y));
      }
      requestRender();
    }

    function moveSelectionTo(nextX, nextY) {
      const frame = selectionFrame();
      if (!frame) {
        return;
      }
      pushHistory();
      const dx = nextX === null ? 0 : nextX - frame.x;
      const dy = nextY === null ? 0 : nextY - frame.y;
      selectedShapes().forEach((shape) => moveShape(shape, dx, dy));
      requestRender();
    }

    function applyToSelection(mutator) {
      const list = selectedShapes();
      if (!list.length) {
        return false;
      }
      pushHistory();
      list.forEach(mutator);
      list.forEach(invalidate);
      requestRender();
      return true;
    }

    function syncStyleFromSelection() {
      const list = selectedShapes();
      if (list.length !== 1) {
        return;
      }
      const shape = list[0];
      style.fillOn = shape.style.fill !== "none";
      if (style.fillOn) {
        style.fill = shape.style.fill;
      }
      style.strokeOn = shape.style.stroke !== "none";
      if (style.strokeOn) {
        style.stroke = shape.style.stroke;
      }
      style.strokeWidth = shape.style.strokeWidth;
      style.dash = shape.style.dash;
      style.opacity = shape.style.opacity;
      style.linecap = shape.style.linecap;
      style.linejoin = shape.style.linejoin;
      if (shape.type === "text") {
        textStyle.text = shape.text;
        textStyle.font = shape.font;
        textStyle.size = shape.size;
        textStyle.weight = shape.weight;
        textStyle.anchor = shape.anchor;
      }
      if (shape.type === "rect") {
        cornerRadius = shape.rx;
        cornerOption.hidden = false;
      }
      if (shape.type === "text") {
        textOptions.hidden = false;
      }
      toolOptionsNote.hidden = !cornerOption.hidden || !textOptions.hidden
        || !polygonOptions.hidden || !smoothOption.hidden;
      syncStyleControls();
    }

    function syncStyleControls() {
      fillColorInput.value = style.fill;
      strokeColorInput.value = style.stroke;
      fillNoneButton.setAttribute("aria-pressed", String(!style.fillOn));
      strokeNoneButton.setAttribute("aria-pressed", String(!style.strokeOn));
      strokeWidthInput.value = style.strokeWidth;
      strokeDashInput.value = style.dash;
      opacityInput.value = Math.round(style.opacity * 100);
      opacityValue.textContent = `${Math.round(style.opacity * 100)}%`;
      textInput.value = textStyle.text;
      textFont.value = textStyle.font;
      textSize.value = textStyle.size;
      cornerRadiusInput.value = cornerRadius;
      cornerValue.textContent = String(Math.round(cornerRadius));
      document.querySelectorAll("[data-linecap]").forEach((button) => {
        button.setAttribute("aria-pressed", String(button.getAttribute("data-linecap") === style.linecap));
      });
      document.querySelectorAll("[data-linejoin]").forEach((button) => {
        button.setAttribute("aria-pressed", String(button.getAttribute("data-linejoin") === style.linejoin));
      });
      document.querySelectorAll("[data-text-weight]").forEach((button) => {
        button.setAttribute("aria-pressed", String(Number(button.getAttribute("data-text-weight")) === textStyle.weight));
      });
      document.querySelectorAll("[data-text-anchor]").forEach((button) => {
        button.setAttribute("aria-pressed", String(button.getAttribute("data-text-anchor") === textStyle.anchor));
      });
      updateSwatches();
    }

    function syncCanvasControls() {
      canvasWidthInput.value = doc.width;
      canvasHeightInput.value = doc.height;
      bgColorInput.value = doc.background;
      bgNoneButton.setAttribute("aria-pressed", String(!doc.backgroundOn));
      gridStepInput.value = grid.step;
      const preset = `${doc.width}x${doc.height}`;
      const known = Array.from(sizePreset.options).some((option) => option.value === preset);
      sizePreset.value = known ? preset : "custom";
    }

    function updateSwatches() {
      const current = paletteTarget === "fill" ? style.fill : style.stroke;
      paletteEl.querySelectorAll(".swatch").forEach((swatch) => {
        swatch.classList.toggle("active", swatch.dataset.color === current);
      });
    }

    function buildPalette() {
      paletteEl.innerHTML = defaultPalette.map((color) => (
        `<button class="swatch" type="button" data-color="${color}" style="background:${color}" aria-label="${color}" title="${color}"></button>`
      )).join("");
    }

    function setTool(tool) {
      if (activeTool === "pen" && tool !== "pen") {
        finishPen(false);
      }
      activeTool = tool;
      if (tool !== "node") {
        editingNodePathId = null;
        selectedNodeIndex = -1;
      } else if (selectedIds.length === 1) {
        const shape = shapeById(selectedIds[0]);
        if (shape && shape.type === "path") {
          startNodeEditing(shape);
        }
      }
      document.querySelectorAll("[data-tool]").forEach((button) => {
        button.setAttribute("aria-pressed", String(button.getAttribute("data-tool") === tool));
      });
      toolHint.textContent = toolHints[tool];
      polygonOptions.hidden = tool !== "polygon";
      cornerOption.hidden = tool !== "rect";
      smoothOption.hidden = tool !== "pencil";
      textOptions.hidden = tool !== "text";
      const hasOptions = !polygonOptions.hidden || !cornerOption.hidden || !smoothOption.hidden || !textOptions.hidden;
      toolOptionsNote.hidden = hasOptions;
      updateCursorState();
      requestRender();
    }

    function exportSvgMarkup() {
      renderNow();
      const clone = sceneLayer.cloneNode(true);
      clone.removeAttribute("id");
      clone.querySelectorAll("[data-id]").forEach((element) => {
        if (element.getAttribute("visibility") === "hidden") {
          element.remove();
          return;
        }
        element.removeAttribute("data-id");
        element.removeAttribute("pointer-events");
      });
      const background = doc.backgroundOn
        ? `<rect x="0" y="0" width="${doc.width}" height="${doc.height}" fill="${doc.background}"></rect>`
        : "";
      return `<svg xmlns="${SVG_NS}" xmlns:xlink="http://www.w3.org/1999/xlink" width="${doc.width}" height="${doc.height}" viewBox="0 0 ${doc.width} ${doc.height}">${background}${clone.innerHTML}</svg>`;
    }

    function downloadBlob(blob, name) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = name;
      document.body.appendChild(link);
      link.click();
      link.remove();
      window.setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function safeFileName(extension) {
      const base = fileNameInput.value.trim().replace(/\.(svg|png)$/i, "") || "vector-art";
      return `${base}.${extension}`;
    }

    function saveSvg() {
      const blob = new Blob([exportSvgMarkup()], { type: "image/svg+xml;charset=utf-8" });
      downloadBlob(blob, safeFileName("svg"));
      setNotice("SVGを保存しました");
    }

    function savePng() {
      const scale = Number(pngScale.value) || 1;
      const markup = exportSvgMarkup();
      const svgBlob = new Blob([markup], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(svgBlob);
      const image = new Image();
      image.onload = () => {
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(doc.width * scale);
        canvas.height = Math.round(doc.height * scale);
        const context = canvas.getContext("2d");
        context.drawImage(image, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);
        canvas.toBlob((blob) => {
          if (!blob) {
            setNotice("PNGを作れませんでした");
            return;
          }
          downloadBlob(blob, safeFileName("png"));
          setNotice("PNGを保存しました");
        }, "image/png");
      };
      image.onerror = () => {
        URL.revokeObjectURL(url);
        setNotice("PNGを作れませんでした");
      };
      image.src = url;
    }

    function exportDetails() {
      const scale = Number(pngScale.value) || 1;
      return {
        canvas: `${doc.width} x ${doc.height}`,
        output: `${Math.round(doc.width * scale)} x ${Math.round(doc.height * scale)}px`,
        name: safeFileName("png")
      };
    }

    function openExportConfirm() {
      const details = exportDetails();
      confirmCanvasSize.textContent = details.canvas;
      confirmOutputSize.textContent = details.output;
      confirmFileName.textContent = details.name;
      exportConfirm.hidden = false;
      confirmExport.focus();
    }

    function importImageFile(file) {
      const reader = new FileReader();
      reader.onload = () => {
        const dataUrl = String(reader.result);
        const probe = new Image();
        probe.onload = () => {
          const naturalWidth = probe.naturalWidth || doc.width;
          const naturalHeight = probe.naturalHeight || doc.height;
          const fit = Math.min(1, (doc.width * 0.8) / naturalWidth, (doc.height * 0.8) / naturalHeight);
          const width = naturalWidth * fit;
          const height = naturalHeight * fit;
          const shape = makeShape("image", {
            x: (doc.width - width) / 2,
            y: (doc.height - height) / 2,
            w: width,
            h: height,
            href: dataUrl,
            style: { ...currentStyle(), fill: "none", stroke: "none" }
          });
          pushHistory();
          addShape(shape);
          setNotice("画像を配置しました");
        };
        probe.onerror = () => setNotice("画像を読み込めませんでした");
        probe.src = dataUrl;
      };
      reader.onerror = () => setNotice("画像を読み込めませんでした");
      reader.readAsDataURL(file);
    }

    function isTypingTarget(target) {
      if (!target) {
        return false;
      }
      const tag = target.tagName;
      return tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || target.isContentEditable;
    }

    function bindSegment(attribute, handler) {
      document.querySelectorAll(`[${attribute}]`).forEach((button) => {
        button.addEventListener("click", () => {
          const group = button.parentElement;
          group.querySelectorAll(`[${attribute}]`).forEach((item) => {
            item.setAttribute("aria-pressed", String(item === button));
          });
          handler(button.getAttribute(attribute));
        });
      });
    }

    document.querySelectorAll("[data-tool]").forEach((button) => {
      button.addEventListener("click", () => setTool(button.getAttribute("data-tool")));
    });

    bindSegment("data-polygon-kind", (value) => {
      polygonKind = value;
    });

    bindSegment("data-linecap", (value) => {
      style.linecap = value;
      applyToSelection((shape) => {
        shape.style.linecap = value;
      });
    });

    bindSegment("data-linejoin", (value) => {
      style.linejoin = value;
      applyToSelection((shape) => {
        shape.style.linejoin = value;
      });
    });

    bindSegment("data-text-weight", (value) => {
      textStyle.weight = Number(value);
      applyToSelection((shape) => {
        if (shape.type === "text") {
          shape.weight = Number(value);
        }
      });
    });

    bindSegment("data-text-anchor", (value) => {
      textStyle.anchor = value;
      applyToSelection((shape) => {
        if (shape.type === "text") {
          shape.anchor = value;
        }
      });
    });

    bindSegment("data-palette-target", (value) => {
      paletteTarget = value;
      updateSwatches();
    });

    bindSegment("data-align-base", (value) => {
      alignBase = value;
    });

    bindSegment("data-grid", (value) => {
      grid.show = value === "on";
      requestRender();
    });

    bindSegment("data-snap", (value) => {
      grid.snap = value === "on";
    });

    polygonSidesInput.addEventListener("change", () => {
      polygonSides = clamp(Math.round(Number(polygonSidesInput.value) || 5), 3, 24);
      polygonSidesInput.value = polygonSides;
    });

    cornerRadiusInput.addEventListener("input", () => {
      cornerRadius = Number(cornerRadiusInput.value) || 0;
      cornerValue.textContent = String(Math.round(cornerRadius));
      const list = selectedShapes().filter((shape) => shape.type === "rect");
      if (!list.length) {
        return;
      }
      list.forEach((shape) => {
        shape.rx = clamp(cornerRadius, 0, Math.min(shape.w, shape.h) / 2);
        invalidate(shape);
      });
      requestRender();
    });

    cornerRadiusInput.addEventListener("change", () => {
      if (selectedShapes().some((shape) => shape.type === "rect")) {
        setNotice("角丸を変更しました");
      }
    });

    smoothLevelInput.addEventListener("input", () => {
      smoothLevel = Number(smoothLevelInput.value) || 0;
      smoothValue.textContent = (smoothLevel / 10).toFixed(1);
    });

    let textEditPushed = false;

    textInput.addEventListener("focus", () => {
      textEditPushed = false;
    });

    textInput.addEventListener("input", () => {
      textStyle.text = textInput.value;
      const list = selectedShapes().filter((shape) => shape.type === "text");
      if (!list.length) {
        return;
      }
      if (!textEditPushed) {
        pushHistory();
        textEditPushed = true;
      }
      list.forEach((shape) => {
        shape.text = textInput.value;
        invalidate(shape);
      });
      requestRender();
    });

    textFont.addEventListener("change", () => {
      textStyle.font = textFont.value;
      applyToSelection((shape) => {
        if (shape.type === "text") {
          shape.font = textStyle.font;
        }
      });
    });

    textSize.addEventListener("change", () => {
      textStyle.size = clamp(Number(textSize.value) || 48, 6, 400);
      textSize.value = textStyle.size;
      applyToSelection((shape) => {
        if (shape.type === "text") {
          shape.size = textStyle.size;
        }
      });
    });

    fillColorInput.addEventListener("input", () => {
      const color = normalizeHex(fillColorInput.value) || style.fill;
      style.fill = color;
      style.fillOn = true;
      fillNoneButton.setAttribute("aria-pressed", "false");
      updateSwatches();
      const list = selectedShapes();
      if (!list.length) {
        return;
      }
      list.forEach((shape) => {
        shape.style.fill = color;
      });
      requestRender();
    });

    fillNoneButton.addEventListener("click", () => {
      style.fillOn = !style.fillOn;
      fillNoneButton.setAttribute("aria-pressed", String(!style.fillOn));
      applyToSelection((shape) => {
        shape.style.fill = style.fillOn ? style.fill : "none";
      });
      requestRender();
    });

    strokeColorInput.addEventListener("input", () => {
      const color = normalizeHex(strokeColorInput.value) || style.stroke;
      style.stroke = color;
      style.strokeOn = true;
      strokeNoneButton.setAttribute("aria-pressed", "false");
      updateSwatches();
      const list = selectedShapes();
      if (!list.length) {
        return;
      }
      list.forEach((shape) => {
        shape.style.stroke = color;
      });
      requestRender();
    });

    strokeNoneButton.addEventListener("click", () => {
      style.strokeOn = !style.strokeOn;
      strokeNoneButton.setAttribute("aria-pressed", String(!style.strokeOn));
      applyToSelection((shape) => {
        shape.style.stroke = style.strokeOn ? style.stroke : "none";
      });
      requestRender();
    });

    strokeWidthInput.addEventListener("change", () => {
      style.strokeWidth = clamp(Number(strokeWidthInput.value) || 0, 0, 200);
      strokeWidthInput.value = style.strokeWidth;
      applyToSelection((shape) => {
        shape.style.strokeWidth = style.strokeWidth;
      });
    });

    strokeDashInput.addEventListener("change", () => {
      style.dash = strokeDashInput.value;
      applyToSelection((shape) => {
        shape.style.dash = style.dash;
      });
    });

    opacityInput.addEventListener("input", () => {
      style.opacity = clamp(Number(opacityInput.value) / 100, 0, 1);
      opacityValue.textContent = `${Math.round(style.opacity * 100)}%`;
      const list = selectedShapes();
      if (!list.length) {
        return;
      }
      list.forEach((shape) => {
        shape.style.opacity = style.opacity;
      });
      requestRender();
    });

    paletteEl.addEventListener("click", (event) => {
      const swatch = event.target.closest(".swatch");
      if (!swatch) {
        return;
      }
      const color = swatch.dataset.color;
      if (paletteTarget === "fill") {
        style.fill = color;
        style.fillOn = true;
        fillColorInput.value = color;
        fillNoneButton.setAttribute("aria-pressed", "false");
        applyToSelection((shape) => {
          shape.style.fill = color;
        });
      } else {
        style.stroke = color;
        style.strokeOn = true;
        strokeColorInput.value = color;
        strokeNoneButton.setAttribute("aria-pressed", "false");
        applyToSelection((shape) => {
          shape.style.stroke = color;
        });
      }
      updateSwatches();
    });

    posX.addEventListener("change", () => moveSelectionTo(Number(posX.value), null));
    posY.addEventListener("change", () => moveSelectionTo(null, Number(posY.value)));
    sizeW.addEventListener("change", () => {
      const frame = selectionFrame();
      if (frame) {
        scaleSelectionTo(Number(sizeW.value), frame.h);
      }
    });
    sizeH.addEventListener("change", () => {
      const frame = selectionFrame();
      if (frame) {
        scaleSelectionTo(frame.w, Number(sizeH.value));
      }
    });
    rotationInput.addEventListener("change", () => {
      const list = selectedShapes();
      if (list.length !== 1) {
        return;
      }
      pushHistory();
      list[0].rot = normalizeAngle(Number(rotationInput.value) || 0);
      requestRender();
    });

    flipHButton.addEventListener("click", () => flipSelection(true));
    flipVButton.addEventListener("click", () => flipSelection(false));
    duplicateObjectButton.addEventListener("click", duplicateSelection);
    deleteObjectButton.addEventListener("click", deleteSelection);
    orderFront.addEventListener("click", () => changeOrder("front"));
    orderUp.addEventListener("click", () => changeOrder("up"));
    orderDown.addEventListener("click", () => changeOrder("down"));
    orderBack.addEventListener("click", () => changeOrder("back"));

    [["#alignLeft", "left"], ["#alignCenterX", "centerX"], ["#alignRight", "right"],
      ["#alignTop", "top"], ["#alignCenterY", "centerY"], ["#alignBottom", "bottom"]
    ].forEach(([selector, mode]) => {
      document.querySelector(selector).addEventListener("click", () => alignSelection(mode));
    });

    objectList.addEventListener("click", (event) => {
      const visibilityButton = event.target.closest("[data-visibility]");
      if (visibilityButton) {
        const shape = shapeById(Number(visibilityButton.getAttribute("data-visibility")));
        if (shape) {
          pushHistory();
          shape.visible = !shape.visible;
          if (!shape.visible) {
            selectedIds = selectedIds.filter((id) => id !== shape.id);
          }
          requestRender();
        }
        return;
      }
      const selectButton = event.target.closest("[data-select]");
      if (selectButton) {
        const id = Number(selectButton.getAttribute("data-select"));
        if (event.shiftKey) {
          selectedIds = selectedIds.includes(id)
            ? selectedIds.filter((item) => item !== id)
            : selectedIds.concat(id);
        } else {
          selectedIds = [id];
        }
        syncStyleFromSelection();
        requestRender();
      }
    });

    objectList.addEventListener("dblclick", (event) => {
      const selectButton = event.target.closest("[data-select]");
      if (!selectButton) {
        return;
      }
      editingObjectId = Number(selectButton.getAttribute("data-select"));
      requestRender();
    });

    function commitRename(input, save) {
      const shape = shapeById(Number(input.getAttribute("data-rename")));
      editingObjectId = null;
      if (shape && save) {
        const name = input.value.trim();
        if (name && name !== shape.name) {
          pushHistory();
          shape.name = name;
        }
      }
      requestRender();
    }

    objectList.addEventListener("keydown", (event) => {
      if (!event.target.hasAttribute || !event.target.hasAttribute("data-rename")) {
        return;
      }
      if (event.key === "Enter") {
        event.preventDefault();
        commitRename(event.target, true);
      } else if (event.key === "Escape") {
        event.preventDefault();
        commitRename(event.target, false);
      }
    });

    objectList.addEventListener("focusout", (event) => {
      if (event.target.hasAttribute && event.target.hasAttribute("data-rename") && editingObjectId !== null) {
        commitRename(event.target, true);
      }
    });

    sizePreset.addEventListener("change", () => {
      if (sizePreset.value === "custom") {
        return;
      }
      const [width, height] = sizePreset.value.split("x").map(Number);
      canvasWidthInput.value = width;
      canvasHeightInput.value = height;
    });

    bgColorInput.addEventListener("input", () => {
      doc.background = normalizeHex(bgColorInput.value) || doc.background;
      doc.backgroundOn = true;
      bgNoneButton.setAttribute("aria-pressed", "false");
      requestRender();
    });

    bgNoneButton.addEventListener("click", () => {
      doc.backgroundOn = !doc.backgroundOn;
      bgNoneButton.setAttribute("aria-pressed", String(!doc.backgroundOn));
      requestRender();
    });

    gridStepInput.addEventListener("change", () => {
      grid.step = clamp(Math.round(Number(gridStepInput.value) || 20), 2, 200);
      gridStepInput.value = grid.step;
      requestRender();
    });

    applyCanvas.addEventListener("click", () => {
      const width = clamp(Math.round(Number(canvasWidthInput.value) || doc.width), 32, 4000);
      const height = clamp(Math.round(Number(canvasHeightInput.value) || doc.height), 32, 4000);
      if (width === doc.width && height === doc.height) {
        setNotice("サイズは変わっていません");
        return;
      }
      pushHistory();
      doc.width = width;
      doc.height = height;
      syncCanvasControls();
      fitView();
      setNotice(`${width} x ${height} にしました`);
    });

    clearCanvas.addEventListener("click", () => {
      if (!shapes.length) {
        setNotice("すでに白紙です");
        return;
      }
      pushHistory();
      shapes = [];
      selectedIds = [];
      editingNodePathId = null;
      penDraft = null;
      requestRender();
      setNotice("白紙にしました");
    });

    undoAction.addEventListener("click", undo);
    redoAction.addEventListener("click", redo);
    zoomIn.addEventListener("click", () => setZoom(view.zoom * 1.25));
    zoomOut.addEventListener("click", () => setZoom(view.zoom / 1.25));
    zoomFit.addEventListener("click", fitView);

    importImage.addEventListener("click", () => imageInput.click());
    imageInput.addEventListener("change", () => {
      const file = imageInput.files && imageInput.files[0];
      if (file) {
        importImageFile(file);
      }
      imageInput.value = "";
    });

    exportSvgButton.addEventListener("click", saveSvg);
    exportPngButton.addEventListener("click", openExportConfirm);
    cancelExport.addEventListener("click", () => {
      exportConfirm.hidden = true;
    });
    confirmExport.addEventListener("click", () => {
      exportConfirm.hidden = true;
      savePng();
    });
    exportConfirm.addEventListener("click", (event) => {
      if (event.target === exportConfirm) {
        exportConfirm.hidden = true;
      }
    });

    stage.addEventListener("pointerdown", onPointerDown);
    window.addEventListener("pointermove", onPointerMove);
    window.addEventListener("pointerup", onPointerUp);
    window.addEventListener("pointercancel", onPointerUp);

    stage.addEventListener("pointermove", (event) => {
      const point = docPoint(event);
      coordLabel.textContent = `x ${Math.round(point.x)}, y ${Math.round(point.y)}`;
    });

    stage.addEventListener("pointerleave", () => {
      coordLabel.textContent = "x -, y -";
    });

    stage.addEventListener("dblclick", (event) => {
      if (activeTool === "pen") {
        finishPen(false);
        return;
      }
      const shape = hitShapeFromEvent(event);
      if (activeTool === "node" && shape && shape.type === "path" && shape.id === editingNodePathId) {
        const point = rotatePoint(docPoint(event), centerOf(shape), -shape.rot);
        const nearest = nearestPointOnPath(shape, point);
        if (nearest && nearest.distance < 12 / view.zoom) {
          pushHistory();
          selectedNodeIndex = splitSegment(shape, nearest.index, nearest.t);
          invalidate(shape);
          requestRender();
          setNotice("頂点を追加しました");
        }
        return;
      }
      if (shape && shape.type === "text") {
        selectedIds = [shape.id];
        syncStyleFromSelection();
        textOptions.hidden = false;
        toolOptionsNote.hidden = true;
        textInput.focus();
        textInput.select();
        requestRender();
      }
    });

    stage.addEventListener("wheel", (event) => {
      event.preventDefault();
      if (event.ctrlKey || event.metaKey) {
        setZoom(view.zoom * Math.exp(-event.deltaY * 0.01), event.clientX, event.clientY);
        return;
      }
      view.x -= event.deltaX;
      view.y -= event.deltaY;
      requestRender();
    }, { passive: false });

    stage.addEventListener("contextmenu", (event) => event.preventDefault());

    window.addEventListener("keydown", (event) => {
      if (event.key === " " && !isTypingTarget(event.target)) {
        spaceDown = true;
        updateCursorState();
        event.preventDefault();
        return;
      }

      const meta = event.metaKey || event.ctrlKey;
      if (meta && event.key.toLowerCase() === "z") {
        event.preventDefault();
        if (event.shiftKey) {
          redo();
        } else {
          undo();
        }
        return;
      }
      if (meta && event.key.toLowerCase() === "d") {
        event.preventDefault();
        duplicateSelection();
        return;
      }
      if (meta && event.key.toLowerCase() === "a" && !isTypingTarget(event.target)) {
        event.preventDefault();
        selectedIds = shapes.filter((shape) => shape.visible).map((shape) => shape.id);
        requestRender();
        return;
      }
      if (meta) {
        return;
      }

      if (isTypingTarget(event.target)) {
        if (event.key === "Escape") {
          event.target.blur();
        }
        return;
      }

      if (event.key === "Escape") {
        if (penDraft) {
          cancelPen();
        } else {
          selectedIds = [];
          editingNodePathId = null;
          requestRender();
        }
        return;
      }

      if (event.key === "Enter" && penDraft) {
        finishPen(false);
        return;
      }

      if (event.key === "Delete" || event.key === "Backspace") {
        event.preventDefault();
        deleteSelection();
        return;
      }

      if (event.key.startsWith("Arrow")) {
        event.preventDefault();
        const step = event.shiftKey ? 10 : (grid.snap ? grid.step : 1);
        const map = {
          ArrowLeft: [-step, 0],
          ArrowRight: [step, 0],
          ArrowUp: [0, -step],
          ArrowDown: [0, step]
        };
        const [dx, dy] = map[event.key];
        nudgeSelection(dx, dy);
        return;
      }

      const shortcuts = {
        v: "select",
        n: "node",
        p: "pen",
        b: "pencil",
        l: "line",
        r: "rect",
        e: "ellipse",
        g: "polygon",
        t: "text"
      };
      const key = event.key.toLowerCase();
      if (shortcuts[key]) {
        setTool(shortcuts[key]);
        return;
      }
      if (key === "0") {
        fitView();
        return;
      }
      if (key === "]") {
        changeOrder("up");
        return;
      }
      if (key === "[") {
        changeOrder("down");
      }
    });

    window.addEventListener("keyup", (event) => {
      if (event.key === " ") {
        spaceDown = false;
        updateCursorState();
      }
    });

    window.addEventListener("blur", () => {
      spaceDown = false;
      updateCursorState();
    });

    if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("service-worker.js").catch(() => {});
      });
    }

    let fitted = false;
    const shellObserver = new ResizeObserver(() => {
      if (!fitted) {
        const rect = stage.getBoundingClientRect();
        if (rect.width > 0 && rect.height > 0) {
          fitted = true;
          fitView();
        }
      }
      requestRender();
    });
    shellObserver.observe(stageShell);

    lockAppTitle();
    buildPalette();
    setTool("select");
    syncStyleControls();
    syncCanvasControls();
    renderNow();
    fitView();
  </script>
</body>
</html>
